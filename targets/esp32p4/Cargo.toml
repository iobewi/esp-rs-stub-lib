[package]
name = "p4-foundation"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "p4-foundation"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "p4-rom-link-smoke"
path = "src/bin/p4-rom-link-smoke.rs"
test = false
bench = false
required-features = ["rom-link-smoke"]

[[bin]]
name = "p4-usb-bringup"
path = "src/bin/p4-usb-bringup.rs"
test = false
bench = false
required-features = ["usb-bringup"]

[features]
usb-bringup = []
# Opt-in only: this ELF may call ROM before a USB session is validated.
rom-link-smoke = []

[dependencies]
stub-core = { path = "../../crates/stub-core" }
stub-rom = { path = "../../crates/stub-rom" }
