name: P4 foundation (software only)
on:
  push:
    branches: ["feat/p4-rust-foundation", "refactor/p4-target-layout"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf
          components: llvm-tools-preview
      - name: Rust host library tests
        run: cargo test --workspace --exclude p4-foundation
      - name: Cross-check portable core for RV32IMC (no_std)
        run: cargo check --release --target riscv32imc-unknown-none-elf -p stub-core
      - name: Default P4 build excludes unsafe ROM link smoke binary
        run: |
          cargo p4-build
          test -f target/riscv32imc-unknown-none-elf/release/p4-foundation
          if test -e target/riscv32imc-unknown-none-elf/release/p4-rom-link-smoke; then
            echo "::error::The ROM link smoke binary must not be built by cargo p4-build"
            exit 1
          fi
          test ! -e target/riscv32imc-unknown-none-elf/release/p4-usb-bringup
      - name: Validate ELF and export stub JSON
        run: |
          python -m pip install pyelftools
          python -m unittest discover -s tests -v
          mkdir -p build
          python tools/elf2stub.py target/riscv32imc-unknown-none-elf/release/p4-foundation build/p4-foundation.json
      - name: Compare generated JSON to PR1 on main (layout PR only)
        if: github.head_ref == 'refactor/p4-target-layout' || github.ref == 'refs/heads/refactor/p4-target-layout'
        run: |
          BASELINE_DIR="$RUNNER_TEMP/p4-pr1-baseline"
          git worktree add --detach "$BASELINE_DIR" 0e82b1c7f2206b2c03f269f32fd52e4e7e303e7f
          (
            cd "$BASELINE_DIR"
            cargo build --release --target riscv32imc-unknown-none-elf -p p4-foundation
            mkdir -p build
            python tools/elf2stub.py target/riscv32imc-unknown-none-elf/release/p4-foundation build/p4-foundation.json
          )
          python tools/compare_stub_json.py "$BASELINE_DIR/build/p4-foundation.json" build/p4-foundation.json --report build/p4-json-comparison.json
      - name: Preserve ELF layout and disassembly for ABI review
        run: |
          LLVM_BIN="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          "$LLVM_BIN/llvm-objdump" --disassemble --no-show-raw-insn target/riscv32imc-unknown-none-elf/release/p4-foundation > build/p4-foundation.disasm.txt
          "$LLVM_BIN/llvm-readobj" --file-headers --sections --symbols target/riscv32imc-unknown-none-elf/release/p4-foundation > build/p4-foundation.elf-report.txt
      - name: Link P4 ROM USB ABI smoke binary (never execute)
        run: |
          cargo build --release --target riscv32imc-unknown-none-elf -p p4-foundation --features rom-link-smoke --bin p4-rom-link-smoke
          LLVM_BIN="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          "$LLVM_BIN/llvm-objdump" --disassemble --no-show-raw-insn --print-imm-hex target/riscv32imc-unknown-none-elf/release/p4-rom-link-smoke > build/p4-rom-link-smoke.disasm.txt
          "$LLVM_BIN/llvm-readobj" --file-headers --sections --symbols target/riscv32imc-unknown-none-elf/release/p4-rom-link-smoke > build/p4-rom-link-smoke.elf-report.txt
          python tools/check_p4_rom_link.py target/riscv32imc-unknown-none-elf/release/p4-rom-link-smoke build/p4-rom-link-smoke.disasm.txt
      - name: Build opt-in P4 USB bring-up and export RAM image
        run: |
          cargo build --release --target riscv32imc-unknown-none-elf -p p4-foundation --features usb-bringup --bin p4-usb-bringup
          python tools/elf2stub.py target/riscv32imc-unknown-none-elf/release/p4-usb-bringup build/p4-usb-bringup.json
          LLVM_BIN="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          "$LLVM_BIN/llvm-objdump" --disassemble --no-show-raw-insn --print-imm-hex target/riscv32imc-unknown-none-elf/release/p4-usb-bringup > build/p4-usb-bringup.disasm.txt
          "$LLVM_BIN/llvm-readobj" --file-headers --sections --symbols target/riscv32imc-unknown-none-elf/release/p4-usb-bringup > build/p4-usb-bringup.elf-report.txt
          python tools/check_p4_rom_link.py --bringup target/riscv32imc-unknown-none-elf/release/p4-usb-bringup build/p4-usb-bringup.disasm.txt
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Upload review-only build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-foundation-target-layout-review
          path: |
            target/riscv32imc-unknown-none-elf/release/p4-foundation
            build/p4-foundation.json
            build/p4-usb-bringup.json
            build/p4-usb-bringup.disasm.txt
            build/p4-usb-bringup.elf-report.txt
            build/p4-json-comparison.json
            build/p4-foundation.disasm.txt
            build/p4-foundation.elf-report.txt
            build/p4-rom-link-smoke.disasm.txt
            build/p4-rom-link-smoke.elf-report.txt
          if-no-files-found: warn
